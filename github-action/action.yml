name: "SORK Security Scan"
description: "AI-powered security scanning for pull requests. Finds vulnerabilities and posts inline fix suggestions."
author: "SORK Cloud"

branding:
  icon: "shield"
  color: "blue"

inputs:
  sork-key:
    description: "SORK license key (from sorkcloud.space dashboard)"
    required: true
  api-url:
    description: "SORK API URL"
    required: false
    default: "https://api.sorkcloud.space"
  fail-on-critical:
    description: "Fail the check if critical vulnerabilities are found"
    required: false
    default: "true"
  fail-on-high:
    description: "Fail the check if high severity vulnerabilities are found"
    required: false
    default: "false"
  scan-mode:
    description: "Scan mode: 'diff' (only changed files) or 'full' (all files)"
    required: false
    default: "diff"

outputs:
  findings:
    description: "Number of security findings"
  critical:
    description: "Number of critical findings"
  high:
    description: "Number of high findings"
  status:
    description: "Scan status: clean, findings, or error"

runs:
  using: "composite"
  steps:
    - name: Get PR diff
      id: diff
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} | head -c 50000 > /tmp/sork_diff.txt
          echo "has_diff=true" >> $GITHUB_OUTPUT
        else
          echo "has_diff=false" >> $GITHUB_OUTPUT
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: SORK Scan
      id: scan
      if: steps.diff.outputs.has_diff == 'true'
      shell: bash
      run: |
        # Build JSON payload safely using jq (no shell interpolation of diff content)
        jq -n \
          --rawfile diff /tmp/sork_diff.txt \
          --arg repo "${{ github.repository }}" \
          --argjson pr "${{ github.event.pull_request.number }}" \
          --arg commit "${{ github.event.pull_request.head.sha }}" \
          --arg branch "${{ github.event.pull_request.head.ref }}" \
          --arg mode "${{ inputs.scan-mode }}" \
          '{diff: $diff, repo: $repo, pr: $pr, commit: $commit, branch: $branch, mode: $mode}' \
          > /tmp/sork_payload.json

        RESPONSE=$(curl -s -X POST "${{ inputs.api-url }}/api/ci/scan" \
          -H "Authorization: Bearer ${{ inputs.sork-key }}" \
          -H "Content-Type: application/json" \
          -d @/tmp/sork_payload.json)

        # Write response to file to avoid shell interpolation issues
        echo "$RESPONSE" > /tmp/sork_response.json

        # Parse results
        FINDINGS=$(jq -r '.findings // 0' /tmp/sork_response.json)
        CRITICAL=$(jq -r '.critical // 0' /tmp/sork_response.json)
        HIGH=$(jq -r '.high // 0' /tmp/sork_response.json)
        STATUS=$(jq -r '.status // "error"' /tmp/sork_response.json)

        echo "findings=$FINDINGS" >> $GITHUB_OUTPUT
        echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
        echo "high=$HIGH" >> $GITHUB_OUTPUT
        echo "status=$STATUS" >> $GITHUB_OUTPUT

        # Clean up
        rm -f /tmp/sork_diff.txt /tmp/sork_payload.json

    - name: Post comment
      if: steps.scan.outputs.findings != '0' && steps.scan.outputs.findings != ''
      shell: bash
      run: |
        if [ -f /tmp/sork_response.json ]; then
          COMMENT=$(jq -r '.comment // empty' /tmp/sork_response.json)
          if [ -n "$COMMENT" ]; then
            # Write comment to file to avoid shell injection via PR content
            echo "$COMMENT" > /tmp/sork_comment.md
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body-file /tmp/sork_comment.md
            rm -f /tmp/sork_comment.md
          fi
          rm -f /tmp/sork_response.json
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Check thresholds
      shell: bash
      run: |
        CRITICAL=${{ steps.scan.outputs.critical }}
        HIGH=${{ steps.scan.outputs.high }}

        if [ "${{ inputs.fail-on-critical }}" = "true" ] && [ "$CRITICAL" -gt 0 ]; then
          echo "::error::SORK found $CRITICAL critical vulnerability(ies). Failing check."
          exit 1
        fi

        if [ "${{ inputs.fail-on-high }}" = "true" ] && [ "$HIGH" -gt 0 ]; then
          echo "::error::SORK found $HIGH high severity vulnerability(ies). Failing check."
          exit 1
        fi

        echo "✅ SORK scan passed"
