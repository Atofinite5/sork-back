services:
  - type: web
    name: sork-back
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && npm run db:push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: CLIENT_ORIGIN
        value: https://sorkcloud.space
